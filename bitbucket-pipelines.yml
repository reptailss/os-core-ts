options:
  size: 2x
definitions:
  services:
    docker:
      memory: 7128
  steps:
    - step: &DOCS_build_push_image_and_deploy
        services:
          - docker
        image: atlassian/default-image:3
        script:
          - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip" && unzip awscliv2.zip && aws/./install && aws --version
          - curl -LO https://dl.k8s.io/release/v1.26.0/bin/linux/amd64/kubectl && install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl && kubectl version --client
          - export BITBUCKET_COMMIT_SHORT=$(echo $BITBUCKET_COMMIT | cut -c1-7)
          - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
          - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
          - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_URL
          - cd packages/docs && docker build -t $ECR_URL/$ECR_REPOSITORY:docs-$BITBUCKET_COMMIT_SHORT-$BITBUCKET_BUILD_NUMBER --file Dockerfile .
          - docker images
          - docker push $ECR_URL/$ECR_REPOSITORY:docs-$BITBUCKET_COMMIT_SHORT-$BITBUCKET_BUILD_NUMBER
          - aws eks --region $AWS_REGION update-kubeconfig --name $EKS_NAME
          - kubectl set image deployment/$K8s_DEPLOYMENT_NAME $K8s_CONTAINER_NAME=$ECR_URL/$ECR_REPOSITORY:docs-$BITBUCKET_COMMIT_SHORT-$BITBUCKET_BUILD_NUMBER  -n $K8s_NAMESPACE
pipelines:
  branches:
    docs:
      - step: *DOCS_build_push_image_and_deploy
